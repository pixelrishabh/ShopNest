version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopnest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopnest_user
      POSTGRES_PASSWORD: shopnest_password
      POSTGRES_DB: shopnest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
