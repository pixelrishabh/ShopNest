databases:
  - name: shopnest-db
    databaseName: shopnest
    user: shopnest_user
    plan: free
    region: oregon

services:
  - type: web
    name: shopnest-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: shopnest-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SELLER_STATE
        value: MH
      - key: SELLER_PIN
        value: "400001"
      - key: SELLER_STORE_NAME
        value: "ShopNest Retail Private Limited"
      - key: SELLER_GSTIN
        value: "27AAACS1234A1Z5"
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        value: "rzp_test_placeholder_key"
      - key: RAZORPAY_KEY_SECRET
        value: "placeholder_secret_key"
      - key: RAZORPAY_WEBHOOK_SECRET
        value: "placeholder_webhook_secret"
      - key: EMAIL_FROM
        value: "orders@shopnest.local"
